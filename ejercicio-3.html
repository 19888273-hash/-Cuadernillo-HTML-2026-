<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formato de Texto</title>
</head>
<body>
    <p>Texto en <strong>negrita importante</strong>.</p>
    <p>Texto en <em>cursiva o énfasis</em>.</p>
    <p>Texto <u>subrayado</u>.</p>
    <p>Texto <mark>resaltado en amarillo</mark>.</p>
</body>
</html>
